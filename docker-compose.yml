services:
  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    env_file:
      - .env
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h localhost -d ${POSTGRES_DB} -U ${POSTGRES_USER}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  stream-farm:
    build:
      context: .
      dockerfile: ./apps/stream-farm/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3003:3001'
