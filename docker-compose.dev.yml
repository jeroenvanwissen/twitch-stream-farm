services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  stream-farm-dev:
    build:
      context: .
      dockerfile: ./apps/stream-farm/Dockerfile.dev
    volumes:
      - ./:/app
      - /node_modules
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3003:3001'
    command: npm run start:dev stream-farm
